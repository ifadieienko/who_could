name: Workshop checks
on:
  pull_request:
  push:
    branches: [main, 'feat/workshop-*']
permissions:
  contents: read
concurrency:
  group: workshop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: who_could_test
          MARIADB_USER: test_user
          MARIADB_PASSWORD: disposable_test_password
          MARIADB_ROOT_PASSWORD: disposable_root_password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Create isolated legacy migration database
        run: |
          python - <<'PY'
          import pymysql
          with pymysql.connect(host='127.0.0.1', user='root', password='disposable_root_password', autocommit=True) as c:
              with c.cursor() as cursor:
                  cursor.execute("CREATE DATABASE who_could_platform_migration")
                  cursor.execute("GRANT ALL ON who_could_platform_migration.* TO 'test_user'@'%'")
                  cursor.execute("CREATE DATABASE who_could_migration")
                  cursor.execute("GRANT ALL ON who_could_migration.* TO 'test_user'@'%'")
          PY
      - name: API, migrations, tenancy and billing guards on MariaDB
        working-directory: backend
        env:
          PLATFORM_MIGRATION_TEST_DATABASE_URL: mariadb+pymysql://test_user:disposable_test_password@127.0.0.1:3306/who_could_platform_migration
          MIGRATION_TEST_DATABASE_URL: mariadb+pymysql://test_user:disposable_test_password@127.0.0.1:3306/who_could_migration
          TEST_DATABASE_URL: mariadb+pymysql://test_user:disposable_test_password@127.0.0.1:3306/who_could_test
        run: python -m unittest discover -s tests -v
      - name: Deployment invariants
        run: |
          python deploy/test_compose_security.py
          bash deploy/test_update_static.sh
          # This fixture retains the production root guard; service/firewall
          # commands are mocked and all managed paths point into a temp dir.
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo bash deploy/test_security_static.sh
          bash deploy/test_compose_modes.sh
          bash -n server.sh
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-traces, path: frontend/test-results, retention-days: 7 }
